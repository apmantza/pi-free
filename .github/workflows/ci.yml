name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lockfile in sync with package.json
        run: npm run check:lockfile

      # Fail on known-vulnerable production deps — the code that actually ships
      # to users. DevDeps are excluded because they do not run in Pi installs.
      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build compiled package
        run: npm run build

      - name: Check Pi extension-loader import policy
        run: npm run check:runtime-imports

      - name: Smoke-load compiled extension through Pi's loader
        run: npm run smoke:pi-loader

      - name: TypeScript lint
        run: npm run lint

  source-install-build:
    name: Production source install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      # This is the path used by `pi install git:...`: devDependencies are
      # omitted, but npm still runs prepare. The build must fetch its pinned
      # compiler transiently rather than require a pre-existing node_modules.
      - name: Install source checkout with production dependencies
        # Required here: prepare is the behavior under test. # NOSONAR
        run: npm ci --omit=dev --no-audit --no-fund # NOSONAR

      - name: Verify production source build
        run: |
          test -f dist/index.js
          node scripts/check-runtime-imports.mjs
          node scripts/smoke-compiled.mjs ./dist/index.js
          node scripts/smoke-pi-loader.mjs ./dist/index.js

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test:run

  install-test:
    name: Install test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pack tarball
        run: npm pack

      - name: Verify required files and no forbidden artifacts in tarball
        shell: bash
        run: |
          TARBALL=$(ls pi-free-*.tgz)
          node scripts/check-tarball.mjs "$TARBALL"

      - name: Install from tarball (simulates pi install npm:pi-free)
        shell: bash
        run: |
          TARBALL=$(ls pi-free-*.tgz)
          npm install -g "$TARBALL"

      - name: Install pi-free through Pi and verify RPC commands
        shell: bash
        run: |
          TARBALL=$(ls pi-free-*.tgz)
          npm run smoke:pi-install -- "$PWD/$TARBALL"

      - name: Verify published relative imports resolve
        shell: bash
        run: |
          INSTALL_DIR=$(npm root -g)/pi-free
          node scripts/check-extensions.mjs "$INSTALL_DIR"
          export PI_FREE_RUNTIME_DIR="$INSTALL_DIR"
          node scripts/check-runtime-imports.mjs

      - name: Smoke-load compiled extension entry
        # Catches missing runtime modules.
        shell: bash
        run: |
          INSTALL_DIR=$(npm root -g)/pi-free
          if command -v cygpath >/dev/null 2>&1; then
            INSTALL_DIR=$(cygpath -w "$INSTALL_DIR")
          fi
          export P="$INSTALL_DIR/package.json"
          ENTRY=$(node -p "require(process.env.P).pi.extensions[0]")
          echo "Loading compiled entry: $INSTALL_DIR/$ENTRY"
          node scripts/smoke-compiled.mjs "$INSTALL_DIR/$ENTRY"
          node scripts/smoke-pi-loader.mjs "$INSTALL_DIR/$ENTRY"
