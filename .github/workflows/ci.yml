name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: artipacked - CI never pushes; no credential needed
        with:
          persist-credentials: false
          # Full history so the whitespace check can diff against the base.
          fetch-depth: 0

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lockfile in sync with package.json
        run: npm run check:lockfile

      # Canonical formatting (oxfmt): the single style authority. Without
      # this gate, editor/agent formatters drift files apart (132 files
      # drifted before the canonical reformat). Markdown is excluded in
      # .oxfmtrc.json — oxfmt's embedded-code formatting is not idempotent.
      - name: Check canonical formatting
        run: npm run format:check

      # Correctness + suspicious lints only (see .oxlintrc.json). Style
      # belongs to the formatter; three rules encode repo conventions or
      # toolchain limits and are allowed with reasons in the config.
      - name: Lint with oxlint
        run: npm run lint:oxlint

      # Dead exports / deps gate (see knip.json). Entry points declared so
      # extension entry, scripts, and tests are not flagged; re-export
      # barrels are checked for genuinely dead entries.
      - name: Check for dead code with knip
        run: npm run check:knip

      # Whitespace errors introduced by the change (trailing space,
      # space-before-tab). The formatter subsumes most of this; the check
      # stays as a cheap backstop for non-code files it does not own.
      # Empty on push-to-master (HEAD is the tip); the branch diff on PRs.
      - name: Check for whitespace errors
        run: git diff --check origin/master...HEAD

      # Fail on known-vulnerable production deps — the code that actually ships
      # to users. DevDeps are excluded because they do not run in Pi installs.
      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build compiled package
        run: npm run build

      - name: Check Pi extension-loader import policy
        run: npm run check:runtime-imports

      - name: Smoke-load compiled extension through Pi's loader
        run: npm run smoke:pi-loader

      - name: TypeScript lint
        run: npm run lint

  source-install-build:
    name: Production source install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: artipacked - CI never pushes; no credential needed
        with:
          persist-credentials: false

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      # This is the path used by `pi install git:...`: devDependencies are
      # omitted, but npm still runs prepare. The build must fetch its pinned
      # compiler transiently rather than require a pre-existing node_modules.
      - name: Install source checkout with production dependencies
        # Required here: prepare is the behavior under test. # NOSONAR
        # zizmor: ignore[adhoc-packages] - ad-hoc install IS the test (#447)
        run: npm ci --omit=dev --no-audit --no-fund # NOSONAR

      # #447: @earendil-works/pi-coding-agent and @earendil-works/pi-tui are
      # optional peers now, so this install must NOT have vendored them (while
      # @earendil-works/pi-ai, a real value import, must still be present).
      - name: Verify no optional host-provided peer was vendored (#447)
        run: node scripts/check-prod-install-shape.mjs

      - name: Verify production source build
        run: |
          test -f dist/index.js
          node scripts/check-runtime-imports.mjs
          node scripts/smoke-compiled.mjs ./dist/index.js

      # smoke-pi-loader.mjs simulates loading dist/index.js through Pi's real
      # extension loader, which lives inside @earendil-works/pi-coding-agent.
      # #447 makes that package an optional peer, so this production install no
      # longer vendors it (that is the fix) — install it here explicitly, as a
      # standalone test fixture standing in for the host, so this step keeps
      # verifying the real loader instead of depending on incidental vendoring.
      - name: Install pi-coding-agent fixture for the loader smoke test
        # --ignore-scripts: this fixture only needs the package's files on
        # disk for import.meta.resolve; it never runs pi-coding-agent's own
        # lifecycle scripts, so skip them (SonarCloud S6505).
        run: >-
          npm install --no-save --ignore-scripts
          @earendil-works/pi-coding-agent@0.84.2 --no-audit --no-fund

      - name: Smoke-load compiled entry through Pi's real loader
        run: node scripts/smoke-pi-loader.mjs ./dist/index.js

      # Same sick-tree detectors as install-test, run here against the
      # --omit=dev tree so shape regressions surface one job earlier.
      - name: Verify pi-ai transitive closure in production tree
        run: node scripts/check-installed-closure.mjs .

      - name: Execute pi-ai entries from production tree
        run: node scripts/smoke-pi-ai-entries.mjs .

      - name: Verify pi-ai deps hoist canonically in production tree
        run: node scripts/check-hoisting.mjs .

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: artipacked - CI never pushes; no credential needed
        with:
          persist-credentials: false

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test:run

      # Drives createAutoFallback() against a REAL pi-coding-agent
      # ModelRuntime (auth gates, setModel semantics) instead of mocks.
      - name: Smoke auto-fallback status surface
        run: npm run smoke:auto-fallback

  install-test:
    name: Install test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: artipacked - CI never pushes; no credential needed
        with:
          persist-credentials: false

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pack tarball
        run: npm pack

      - name: Verify required files and no forbidden artifacts in tarball
        shell: bash
        run: |
          TARBALL=$(ls pi-free-*.tgz)
          node scripts/check-tarball.mjs "$TARBALL"

      - name: Install from tarball (simulates pi install npm:pi-free)
        shell: bash
        run: |
          TARBALL=$(ls pi-free-*.tgz)
          npm install -g "$TARBALL" # zizmor: ignore[adhoc-packages]

      - name: Install pi-free through Pi and verify RPC commands
        shell: bash
        run: |
          TARBALL=$(ls pi-free-*.tgz)
          npm run smoke:pi-install -- "$PWD/$TARBALL"

      # Upgrade over the latest published release (seeds a realistic
      # long-lived tree), then re-verify load + session + filter checks.
      - name: Upgrade published release through Pi and re-verify
        shell: bash
        run: |
          TARBALL=$(ls pi-free-*.tgz)
          npm run smoke:pi-upgrade -- "$PWD/$TARBALL"

      - name: Verify published relative imports resolve
        shell: bash
        run: |
          INSTALL_DIR=$(npm root -g)/pi-free
          node scripts/check-extensions.mjs "$INSTALL_DIR"
          export PI_FREE_RUNTIME_DIR="$INSTALL_DIR"
          node scripts/check-runtime-imports.mjs

      - name: Smoke-load compiled extension entry
        # Catches missing runtime modules.
        shell: bash
        run: |
          INSTALL_DIR=$(npm root -g)/pi-free
          if command -v cygpath >/dev/null 2>&1; then
            INSTALL_DIR=$(cygpath -w "$INSTALL_DIR")
          fi
          export P="$INSTALL_DIR/package.json"
          ENTRY=$(node -p "require(process.env.P).pi.extensions[0]")
          echo "Loading compiled entry: $INSTALL_DIR/$ENTRY"
          node scripts/smoke-compiled.mjs "$INSTALL_DIR/$ENTRY"
          node scripts/smoke-pi-loader.mjs "$INSTALL_DIR/$ENTRY"

      # #510: pi-ai was present but its own transitive dep (typebox) was
      # unresolvable in the installed tree — a layout every load-only smoke
      # above passes, while first real pi-ai use crashes. These two steps
      # close that hole: the closure check proves the deps resolve, the
      # entries smoke proves they execute. Both run on every matrix OS.
      - name: Verify pi-ai transitive closure in installed tree (#510)
        shell: bash
        run: |
          INSTALL_DIR=$(npm root -g)/pi-free
          node scripts/check-installed-closure.mjs "$INSTALL_DIR"

      - name: Execute pi-ai entries from installed tree (#510)
        shell: bash
        run: |
          INSTALL_DIR=$(npm root -g)/pi-free
          node scripts/smoke-pi-ai-entries.mjs "$INSTALL_DIR"

      - name: Verify pi-ai deps hoist canonically in installed tree
        shell: bash
        run: |
          INSTALL_DIR=$(npm root -g)/pi-free
          node scripts/check-hoisting.mjs "$INSTALL_DIR"

      # Failure forensics: the smoke scripts preserve free.log/free.json
      # into .smoke-artifacts/ on failure (the temp HOME is deleted).
      # Upload them so a red install-test is debuggable from the run.
      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: smoke-artifacts-${{ matrix.os }}
          path: .smoke-artifacts/
          if-no-files-found: ignore
